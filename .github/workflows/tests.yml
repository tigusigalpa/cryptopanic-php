name: Tests

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: PHP ${{ matrix.php-version }} / Laravel ${{ matrix.laravel }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - php-version: '8.1'
            testbench: ''
            laravel: 'core'
          - php-version: '8.2'
            testbench: '^10.0'
            laravel: '12'
          - php-version: '8.3'
            testbench: '^11.0'
            laravel: '13'
          - php-version: '8.4'
            testbench: '^11.0'
            laravel: '13'
          - php-version: '8.5'
            testbench: '^11.0'
            laravel: '13'

    steps:
      - uses: actions/checkout@v7

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php-version }}
          extensions: curl, json
          coverage: none
          tools: composer:v2

      - name: Validate composer.json
        run: composer validate --strict --no-check-lock

      - name: Remove Laravel test harness for core PHP check
        if: matrix.testbench == ''
        run: composer remove --dev --no-update orchestra/testbench

      - name: Select Laravel test harness
        if: matrix.testbench != ''
        run: composer require --dev --no-update orchestra/testbench:"${{ matrix.testbench }}"

      - name: Resolve dependencies
        run: composer update --prefer-dist --no-interaction

      - name: Audit dependencies
        run: composer audit

      - name: Static analysis
        if: matrix.testbench != ''
        run: composer analyse

      - name: Static analysis for core PHP
        if: matrix.testbench == ''
        run: >-
          vendor/bin/phpstan analyse
          src/CryptoPanicClient.php
          src/CryptoPanicConfig.php
          src/Enums
          src/Exceptions
          src/Models
          src/PostsQuery.php
          src/Transport
          --memory-limit=512M

      - name: Test
        if: matrix.testbench != ''
        run: composer test

      - name: Test core PHP client
        if: matrix.testbench == ''
        run: composer test:unit
